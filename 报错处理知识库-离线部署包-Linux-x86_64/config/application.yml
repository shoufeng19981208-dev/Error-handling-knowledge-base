#     path: ./uploads          # 截图上传目录（相对部署包根目录）
# spring:
#   datasource:
#     url: jdbc:h2:file:./data/errorkb;DB_CLOSE_DELAY=-1;MODE=MySQL   # H2 数据库文件位置
#   h2:
#     console:
#       enabled: false         # 生产环境如需关闭 H2 控制台，改为 false
