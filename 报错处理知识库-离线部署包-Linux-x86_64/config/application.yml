# ============================================
# 报错处理知识库 - 外置配置
# 此文件按「属性级」覆盖 jar 内的默认配置，修改后执行 ./restart.sh 生效
# ============================================
server:
  # 服务端口（前端页面与后端接口同一端口）
  port: 8080

# ---- 以下为可选覆盖项，需要时取消注释修改 ----
