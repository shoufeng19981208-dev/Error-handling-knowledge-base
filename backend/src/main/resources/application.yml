server:
  port: 8080

spring:
  application:
    name: error-knowledge-base
  datasource:
    # MySQL 数据库
    url: jdbc:mysql://localhost:3306/errorkb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: errorkb
    password: Errorkb@2026
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      # 文档管理支持任意格式，放宽单文件限制（默认 50MB，可按需调整）
      max-file-size: 50MB
      max-request-size: 50MB

file:
  upload:
    path: ./uploads

logging:
  level:
    com.kb: debug
