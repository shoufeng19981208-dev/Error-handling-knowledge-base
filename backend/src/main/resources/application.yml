server:
  port: 8080

spring:
  application:
    name: error-knowledge-base
  datasource:
    # H2 文件数据库: 存储在 user.dir/data/ 下，支持跨平台部署
    # AUTO_SERVER=TRUE 防止多进程访问时的文件锁问题
    url: jdbc:h2:file:./data/errorkb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload:
    # 上传目录相对启动脚本所在的工作目录。
    path: ./uploads

logging:
  level:
    com.kb: debug
