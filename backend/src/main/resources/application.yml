server:
  port: 8080

spring:
  application:
    name: error-knowledge-base
  datasource:
    url: jdbc:h2:file:./data/errorkb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload:
    path: /Users/dingsf/Desktop/Codex/报错处理知识库/backend/uploads

logging:
  level:
    com.kb: debug
